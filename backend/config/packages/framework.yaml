# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # La cookie se renueva en cada respuesta que usa la sesión: 7200 segundos sin actividad.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        name: aselto_sesion
        cookie_lifetime: 7200
        gc_maxlifetime: 7200
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
    csrf_protection: true
    http_client:
        default_options:
            timeout: 5
    rate_limiter:
        login_attempt:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        password_reset:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            name: aselto_sesion
            cookie_lifetime: 7200
            gc_maxlifetime: 7200
            cookie_secure: auto
            cookie_httponly: true
            cookie_samesite: lax
